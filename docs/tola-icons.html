<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Logomark Tola — chọn mẫu</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 30px 26px 40px;
        font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
        background: #f7f6fc; color: #1c1b22;
      }
      h1 { font-size: 18px; margin: 0 0 5px; }
      p.sub { margin: 0 0 24px; color: #6b6880; font-size: 12.5px; max-width: 780px; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      .cell { background: #fff; border: 1px solid #e9e7f3; border-radius: 18px; padding: 16px 14px 14px; text-align: center; }
      .row { display: flex; align-items: center; justify-content: center; gap: 18px; min-height: 86px; }
      /* nút thật trên thanh tab: vòng tròn tối + viên tên đè mép dưới */
      .fabwrap { display: flex; flex-direction: column; align-items: center; }
      .fab {
        width: 56px; height: 56px; border-radius: 999px; display: grid; place-items: center;
        background: linear-gradient(to bottom, #454cab, #1b1d4d); color: #fff;
        box-shadow: 0 8px 22px -8px rgba(27,29,77,.75); outline: 4px solid #fff;
      }
      .tag {
        position: relative; z-index: 2; margin-top: -8px;
        background: #5b63d3; color: #fff; border-radius: 999px; padding: 3px 8px;
        font-size: 10.5px; font-weight: 800; line-height: 1; box-shadow: 0 0 0 2px #fff;
      }
      .flat { color: #2b2f6b; display: grid; place-items: center; }
      .tiny { color: #2b2f6b; display: grid; place-items: center; }
      .name { margin-top: 12px; font-size: 13.5px; font-weight: 800; }
      .desc { font-size: 11.5px; color: #6b6880; margin-top: 3px; min-height: 32px; }
      .num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 999px;
             background: #eef0fd; color: #474ead; font-size: 11.5px; font-weight: 800; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <h1>Logomark Tola — 6 mẫu khối đặc, có khe âm bản</h1>
    <p class="sub">
      Khác đợt trước: đây là <b>logomark</b> (khối dày, góc cạnh, khoét âm bản) chứ không phải icon nét mảnh —
      cùng thể loại với mark của Kalopilot. Mỗi mẫu hiện trong nút tròn 56px như thật, phẳng 34px, và 18px để kiểm độ rõ.
    </p>
    <div class="grid" id="grid"></div>

    <script>
      const MARKS = [
        {
          name: "Chong chóng sắc",
          desc: "4 cánh nhọn xoay, khe âm bản hình chữ thập ở tâm",
          svg: `<g fill="currentColor">
                  <path d="M12 12 11.1 2.4 20.6 6.1Z"/>
                  <path d="M12 12 21.6 11.1 17.9 20.6Z" opacity=".86"/>
                  <path d="M12 12 12.9 21.6 3.4 17.9Z" opacity=".72"/>
                  <path d="M12 12 2.4 12.9 6.1 3.4Z" opacity=".58"/>
                </g>`,
        },
        {
          name: "T trong kim cương",
          desc: "Khối kim cương đặc, chữ T khoét rỗng — monogram đúng nghĩa",
          svg: `<path fill="currentColor" fill-rule="evenodd" d="M12 1.6 22.4 12 12 22.4 1.6 12Z
                  M7.4 8.6 16.6 8.6 16.6 11.6 13.5 11.6 13.5 17.9 10.5 17.9 10.5 11.6 7.4 11.6Z"/>`,
        },
        {
          name: "T nghiêng",
          desc: "Thân chữ vát chéo như đang tiến tới — khe hở giữa ngang và thân",
          svg: `<g fill="currentColor">
                  <path d="M4.2 4.4 19.8 4.4 19.8 9.1 4.2 9.1Z" rx="1"/>
                  <path d="M10.1 10.8 15.2 10.8 13.1 20.2 8 20.2Z"/>
                </g>`,
        },
        {
          name: "Cánh kép",
          desc: "Hai cánh lệch tầng — gợi tốc độ, không trùng icon nào",
          svg: `<g fill="currentColor">
                  <path d="M2.6 13.4 13.2 3.2 11.1 11.4 21.4 10.6 10.8 20.8 12.9 12.6Z"/>
                </g>`,
        },
        {
          name: "Mũi kép hướng lên",
          desc: "Hai chevron dày chồng nhau — chọn ra người dẫn đầu",
          svg: `<g fill="currentColor">
                  <path d="M12 2.6 21.4 11.4 17.2 11.4 12 6.6 6.8 11.4 2.6 11.4Z"/>
                  <path d="M12 11.4 21.4 20.2 17.2 20.2 12 15.4 6.8 20.2 2.6 20.2Z" opacity=".66"/>
                </g>`,
        },
        {
          name: "Khối T xoay",
          desc: "Hai khối chữ nhật lệch 45° giao nhau, tâm khoét rỗng",
          svg: `<g fill="currentColor" fill-rule="evenodd">
                  <path d="M3.4 9 20.6 9 20.6 15 3.4 15Z M10.2 10.6 13.8 10.6 13.8 13.4 10.2 13.4Z" transform="rotate(-45 12 12)"/>
                  <path d="M9 3.4 15 3.4 15 20.6 9 20.6Z M10.6 10.2 13.4 10.2 13.4 13.8 10.6 13.8Z" transform="rotate(-45 12 12)" opacity=".55"/>
                </g>`,
        },
      ];

      const svg = (inner, size) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none">${inner}</svg>`;

      document.getElementById("grid").innerHTML = MARKS.map(
        (m, i) => `
        <div class="cell">
          <div class="num">${i + 1}</div>
          <div class="row">
            <div class="fabwrap">
              <div class="fab">${svg(m.svg, 30)}</div>
              <div class="tag">Tola</div>
            </div>
            <div class="flat">${svg(m.svg, 34)}</div>
            <div class="tiny">${svg(m.svg, 18)}</div>
          </div>
          <div class="name">${m.name}</div>
          <div class="desc">${m.desc}</div>
        </div>`,
      ).join("");
    </script>
  </body>
</html>
